<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>File Converter</title>

  <link rel="icon" type="image/png" href="Convy.png">

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:700px;
      background:#1e293b;
      padding:25px;
      border-radius:16px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:5px;
    }

    p{
      text-align:center;
      color:#cbd5e1;
      margin-bottom:20px;
    }

    .section{
      margin-top:15px;
      padding:15px;
      background:#0f172a;
      border-radius:12px;
    }

    input, select, button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      font-size:16px;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#0ea5e9;
    }

    .status{
      text-align:center;
      margin-top:15px;
      color:#94a3b8;
    }

    a{
      color:#38bdf8;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>File Converter</h1>
  <p>Images • Video • Audio</p>

  <!-- IMAGE -->
  <div class="section">
    <h3>🖼️ Image Converter</h3>

    <input type="file" id="imageFile" accept="image/*">

    <select id="imageAction">
      <option value="jpg">→ JPG</option>
      <option value="png">→ PNG</option>
      <option value="webp">→ WEBP</option>
    </select>

    <button onclick="convertImage()">Convert Image</button>
  </div>

  <!-- VIDEO -->
  <div class="section">
    <h3>🎥 Video / Audio</h3>

    <input type="file" id="videoFile">

    <select id="videoAction">
      <option value="mp3">Video → MP3</option>
      <option value="mp4">Video → MP4</option>
    </select>

    <button onclick="convertVideo()">Convert Video</button>
  </div>

  <div class="status" id="status">Waiting...</div>
  <div id="output"></div>

</div>

<script type="module">
import { createFFmpeg, fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';

const ffmpeg = createFFmpeg({ log:true });
let loaded = false;

async function loadFFmpeg(){
  if(!loaded){
    document.getElementById("status").innerText = "Loading engine...";
    await ffmpeg.load();
    loaded = true;
  }
}

/* 🖼️ IMAGE CONVERTER */
window.convertImage = function(){
  const file = document.getElementById("imageFile").files[0];
  const action = document.getElementById("imageAction").value;
  const status = document.getElementById("status");

  if(!file){
    alert("Select an image first");
    return;
  }

  status.innerText = "Converting image...";

  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = () => {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img,0,0);

    let type = "image/png";
    let ext = "png";

    if(action === "jpg"){
      type = "image/jpeg";
      ext = "jpg";
    }

    if(action === "webp"){
      type = "image/webp";
      ext = "webp";
    }

    canvas.toBlob(blob => {
      if(!blob){
        status.innerText = "Image conversion failed";
        return;
      }

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "converted." + ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      URL.revokeObjectURL(url);

      status.innerText = "Done!";
    }, type);
  };
};

/* 🎥 VIDEO CONVERTER */
window.convertVideo = async function(){

  const file = document.getElementById("videoFile").files[0];
  const action = document.getElementById("videoAction").value;
  const status = document.getElementById("status");

  if(!file){
    alert("Select a video first");
    return;
  }

  await loadFFmpeg();

  status.innerText = "Processing video...";

  ffmpeg.FS('writeFile','input',await fetchFile(file));

  let out = action === "mp3" ? "out.mp3" : "out.mp4";

  if(action === "mp3"){
    await ffmpeg.run('-i','input','out.mp3');
  } else {
    await ffmpeg.run('-i','input','-c:v','libx264','out.mp4');
  }

  const data = ffmpeg.FS('readFile',out);

  let mime = action === "mp3" ? "audio/mpeg" : "video/mp4";

  const blob = new Blob([data.buffer], { type: mime });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `converted.${action}`;

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  URL.revokeObjectURL(url);

  status.innerText = "Done!";
};

</script>

</body>
</html>
