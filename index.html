<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>File Converter</title>

  <!-- FAVICON (tab icon) -->
  <link rel="icon" type="image/png" href="Convy.png">

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:700px;
      background:#1e293b;
      padding:25px;
      border-radius:16px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    header{
      text-align:center;
      margin-bottom:10px;
    }

    .logo{
      width:120px;
      border-radius:12px;
    }

    h1{
      text-align:center;
      margin-bottom:5px;
    }

    p{
      text-align:center;
      color:#cbd5e1;
      margin-bottom:20px;
    }

    select, input, button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      font-size:16px;
    }

    button{
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#0ea5e9;
    }

    .status{
      text-align:center;
      margin-top:15px;
      color:#94a3b8;
      font-size:14px;
    }

    .section{
      margin-top:15px;
      padding:15px;
      background:#0f172a;
      border-radius:12px;
    }
  </style>
</head>
<body>

<div class="box">

  <header>
    <img src="Convy.png" class="logo" alt="Logo">
  </header>

  <h1>File Converter</h1>
  <p>Images • Video • Audio • Basic PDF tools</p>

  <select id="type" onchange="updateOptions()">
    <option value="image">Image</option>
    <option value="video">Video / Audio</option>
    <option value="pdf">PDF (basic)</option>
  </select>

  <input type="file" id="file" />

  <select id="action"></select>

  <button onclick="convert()">Convert</button>

  <div class="status" id="status">Waiting...</div>
  <div id="output"></div>

</div>

<script type="module">
import { createFFmpeg, fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';

const ffmpeg = createFFmpeg({ log:true });
let loaded = false;

async function loadFFmpeg(){
  if(!loaded){
    document.getElementById('status').innerText = "Loading engine...";
    await ffmpeg.load();
    loaded = true;
  }
}

const action = document.getElementById('action');

window.updateOptions = function(){
  const type = document.getElementById('type').value;

  if(type === "image"){
    action.innerHTML = `
      <option value="img-jpg">PNG/JPG → JPG</option>
      <option value="img-png">JPG/PNG → PNG</option>
      <option value="img-webp">Image → WEBP</option>
    `;
  }

  if(type === "video"){
    action.innerHTML = `
      <option value="mp3">Video → MP3</option>
      <option value="mp4">Video → MP4</option>
    `;
  }

  if(type === "pdf"){
    action.innerHTML = `
      <option value="pdf-text">PDF → Text (basic)</option>
    `;
  }
}

updateOptions();

window.convert = async function(){

  const file = document.getElementById('file').files[0];
  const act = document.getElementById('action').value;
  const status = document.getElementById('status');
  const output = document.getElementById('output');

  if(!file){
    alert("Upload a file first");
    return;
  }

  output.innerHTML = "";

  /* ---------------- IMAGE CONVERSION ---------------- */
  if(act.startsWith("img")){

    status.innerText = "Processing image...";

    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img,0,0);

      let type = "image/png";

      if(act === "img-jpg") type = "image/jpeg";
      if(act === "img-webp") type = "image/webp";

      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        output.innerHTML = `<a download='converted' href='${url}'>Download Image</a>`;
        status.innerText = "Done!";
      }, type);

    };

  }

  /* ---------------- VIDEO / AUDIO ---------------- */
  else if(act === "mp3" || act === "mp4"){

    await loadFFmpeg();

    status.innerText = "Processing video/audio...";

    ffmpeg.FS('writeFile','input',await fetchFile(file));

    let out = act === "mp3" ? "out.mp3" : "out.mp4";

    if(act === "mp3"){
      await ffmpeg.run('-i','input','out.mp3');
    } else {
      await ffmpeg.run('-i','input','-c:v','libx264','out.mp4');
    }

    const data = ffmpeg.FS('readFile',out);
    const url = URL.createObjectURL(new Blob([data.buffer]));

    output.innerHTML = `<a download='converted.${act}' href='${url}'>Download File</a>`;
    status.innerText = "Done!";
  }

  /* ---------------- PDF (basic) ---------------- */
  else if(act === "pdf-text"){
    status.innerText = "PDF tools require backend for full support.";
    output.innerHTML = "Text extraction not fully supported in browser demo.";
  }

}
</script>

</body>
</html>
